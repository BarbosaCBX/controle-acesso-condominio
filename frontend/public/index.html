<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Acesso - Condomínio</title>
  <link rel="stylesheet" href="../src/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Portaria - Registro de Visitantes</h1>
      <span id="status-badge" class="badge offline">API Offline</span>
    </header>

    <main>
      <section class="card">
        <h2>Novo Cadastro de Entrada</h2>
        <form id="visitor-form">
          <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva">
          </div>
          
          <div class="form-group">
            <label for="documento">Documento (CPF/RG):</label>
            <input type="text" id="documento" name="documento" required placeholder="Ex: 000.000.000-00">
          </div>

          <div class="form-group">
            <label for="unidade">Unidade / Bloco:</label>
            <input type="text" id="unidade" name="unidade" required placeholder="Ex: Bloco A - Ap 42">
          </div>

          <button type="submit" id="btn-submit">Registrar Entrada</button>
        </form>
      </section>

      <section class="card">
        <h2>Visitantes Ativos no Condomínio</h2>
        <table id="visitors-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Documento</th>
              <th>Unidade</th>
              <th>Horário Entrada</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="visitors-list">
            <!-- Linhas inseridas via JS -->
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="../src/app.js"></script>
</body>
</html>
